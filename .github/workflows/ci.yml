name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Verify TypeScript and production build
        run: npm run build

  native:
    name: Native (Rust) tests and lint
    # The native shell links macOS frameworks (Speech, AVFoundation, Security)
    # through Objective-C bridges, so it is checked on macOS.
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri::generate_context! needs frontendDist to exist at compile time.
      # The web build is verified by the other job; a placeholder is enough here.
      - name: Create placeholder frontend bundle
        run: mkdir -p dist && echo '<!doctype html><title>LearnForge</title>' > dist/index.html

      - name: Lint
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test
