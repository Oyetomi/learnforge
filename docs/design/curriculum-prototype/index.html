rgin:24px 0;color:var(--muted);font-size:11px}.summary strong{color:var(--ink);font-size:15px;margin-right:6px}.summary .dem strong{color:var(--green)}.next{display:flex;align-items:center;gap:22px;border-left:3px solid var(--accent);padding:18px 21px;background:#22221e;margin-bottom:30px}.next .text{flex:1}.next h2{font-size:17px}.next p{font-size:11px;margin-top:5px}.next .eyebrow{margin-bottom:4px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:26px;align-items:start}.viewbar{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:20px}.tabs{display:flex;gap:4px}.tabs button{font-size:11px;padding:7px 12px}.tabs button[aria-pressed=true]{background:#303935;border-color:#526158}.viewbar .quiet{padding:7px;font-size:11px}.graph{display:grid;grid-template-columns:1fr 1fr;gap:22px 32px;position:relative;padding:4px 0}.graph svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.graph .node:nth-of-type(5){grid-column:1;grid-row:3}.graph .node:nth-of-type(6){grid-column:2;grid-row:3}.node{position:relative;display:block;text-align:left;background:var(--panel);border-radius:8px;padding:18px;min-height:128px;width:100%}.node[aria-pressed=true]{border-color:var(--accent);background:#25251f}.node .status{display:flex;justify-content:space-between;gap:8px;font-size:10px;color:var(--muted);margin-bottom:13px}.node h3{font-size:13px;line-height:1.55}.node .sub{font-size:10px;margin-top:12px;color:var(--muted)}.node .done{color:var(--green)}.node .current{color:var(--accent)}.node:after{display:none}.node:nth-last-child(-n+2):after{display:none}.legend{display:flex;gap:15px;font-size:10px;color:var(--muted);flex-wrap:wrap;margin-top:18px}.legend .dot{color:var(--accent)}.inspector{padding:23px;background:var(--panel);border:1px solid var(--line);border-radius:9px}.inspector h2{font-size:19px;margin:10px 0 16px}.inspector p{font-size:12px}.inspector h3{font-size:11px;color:var(--muted);margin:22px 0 10px}.unit{border-top:1px solid var(--line);padding:12px 0;font-size:11px}.unit b{font-weight:400;color:var(--green);display:block;font-size:10px;margin-top:4px}.inspector .primary{width:100%;margin-top:20px;font-size:11px}.inspector .quiet{width:100%;font-size:10px;margin-top:8px}.preview-warning{font-size:10px!important;color:var(--accent);margin-top:15px}.repair{border:1px dashed #ac9d79;background:#24251e;border-radius:6px;padding:15px;margin-bottom:18px}.repair p{font-size:11px}.repair button{font-size:10px;margin-top:10px}.outline{list-style:none;padding:0;margin:0}.outline li{margin-bottom:10px}.outline button{width:100%;text-align:left;padding:15px;display:flex;justify-content:space-between;gap:15px}.outline button[aria-pressed=true]{border-color:var(--accent)}.outline small{display:block;margin-top:4px}.trail{font-size:11px;color:var(--muted);margin-bottom:25px}.lesson{max-width:950px;margin:auto}.lesson-panel{padding:32px;background:var(--panel);border:1px solid var(--line);border-radius:10px}.lesson-panel h1{font-size:28px}.lesson-panel>p{margin:22px 0;font-size:14px;max-width:700px}.worked{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:25px 0}.worked article{border:1px solid var(--line);padding:20px;border-radius:6px}.worked p{font-size:12px;margin-top:12px}.worked .count{color:var(--accent);font-size:24px;margin:12px 0}.lesson-panel footer{border-top:1px solid var(--line);padding-top:20px;margin-top:25px;display:flex;justify-content:space-between;gap:20px}.note{padding:15px 0;font-size:11px;color:var(--muted)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}#notice{font-size:11px;color:var(--accent);margin-top:16px;min-height:18px}.session-evidence{background:#202a24;padding:20px;border:1px solid #45604e;border-radius:6px;margin-top:20px}.session-evidence p{font-size:12px;margin-top:8px}details{margin-top:20px}summary{cursor:pointer}code{font-family:'Google Sans Code',monospace}body>footer{max-width:1360px;margin:auto;padding:20px 36px;color:var(--muted);font-size:10px}button,input,select{min-height:36px}@media(min-width:1550px){.shell{padding-top:50px}}@media(max-width:1000px){.workspace{grid-template-columns:minmax(0,1fr) 275px;gap:18px}.shell{padding:26px 22px}.node{padding:14px}.top{padding:14px 22px}.heading h1{font-size:27px}.prototype{display:block;margin:2px 0 0;padding:0;border:0}}@media(max-width:760px){.workspace,.review-grid{grid-template-columns:1fr}.graph{gap:14px}.node:after{height:14px;bottom:-15px}.next{flex-wrap:wrap}.next .text{flex-basis:70%}.top{align-items:flex-start}.top nav{flex-direction:column;align-items:flex-end}.heading{display:block}.heading .badge{margin-top:12px}.worked{grid-template-columns:1fr}.viewbar{align-items:flex-start;flex-wrap:wrap}.review-footer,.actions{flex-wrap:wrap}.intro{margin:20px auto}.lesson-panel{padding:22px}.modes{flex-wrap:wrap}}@media(prefers-reduced-motion:no-preference){main{animation:appear .16s ease-out}@keyframes appear{from{opacity:.6;transform:translateY(5px)}to{opacity:1;transform:none}}}
</style></head><body><header class="top"><div class="brand">learnforge<span>.</span><span class="prototype">Product design prototype · sample content</span></div><nav aria-label="Prototype"><button class="quiet" id="restart">Start over</button><a href="../../curriculum-product-design.md">Read the proposal ↗</a></nav></header><main class="shell" id="app"></main><footer>Design exploration · no AI calls, assessment or saved progress. All examples are authored fixtures.</footer><script>
const fixtures={
go:{goal:'Data structures and algorithms in Go',destination:'Choose, implement and explain the right data structure or algorithm for a problem.',context:'I can write small Go programs',exclude:'Advanced competitive programming, distributed systems and language internals.',current:1,modules:[
['Reason about cost','Compare how work grows as inputs get larger.',['Count the work in a small search','Compare linear and logarithmic growth']],
['Store and find data','Choose a structure by the operations a problem needs.',['Compare a scan with a lookup','Choose a collection for a small service']],
['Work through a sequence','Use stacks and queues to manage ordered work.',['Trace a stack and a queue','Choose ordering for a work list']],
['Search and sort','Explain algorithm choices and their trade-offs.',['Narrow a sorted search space','Compare two sorting strategies']],
['Explore relationships','Represent connected data and traverse it.',['Represent a tree or graph','Trace breadth-first exploration']],
['Apply and defend a solution','Solve a new problem and justify the trade-offs.',['Build a small indexed collection','Explain and test a design choice']]]},
yoruba:{goal:'Everyday Yoruba for a beginner',destination:'Take part in simple, familiar everyday exchanges with appropriate support.',context:'I am starting from the beginning',exclude:'Linguistic analysis, acoustic modelling and claims of fluency. Audio assessment requires a reliable supported modality.',current:1,modules:[
['Get oriented','Recognize the purpose and context of a short everyday exchange.',['Notice familiar situations','Match a purpose to an exchange']],
['Meet someone','Understand the parts of a simple introduction.',['Identify a greeting and response','Build a short introduction']],
['Ask for everyday needs','Recognize and practise a simple request.',['Choose a request for a situation','Respond to a familiar request']],
['Talk about daily life','Connect familiar words to a short routine.',['Understand a familiar routine','Describe a simple daily activity']],
['Handle a misunderstanding','Ask for clarification and try again.',['Recognize when clarification is needed','Repair a short exchange']],
['Use it in context','Combine familiar language in a supported conversation.',['Prepare a realistic exchange','Respond in a new familiar situation']]]}}
let state={subject:'go',mode:'full',page:'entry',selected:1,view:'map',repair:false,check:false,notice:''};const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const data=()=>fixtures[state.subject];const button=(text,action,cls='')=>`<button class="${cls}" data-action="${action}">${text}</button>`;
function reveal(selector){let el=app.querySelector(selector);if(!el)return;el.setAttribute('tabindex','-1');el.focus({preventScroll:true});el.scrollIntoView({block:'nearest',behavior:'instant'});}
function render(focus=true){let d=data();document.title='LearnForge · '+({entry:'Define a goal',review:'Review the curriculum',map:'Curriculum overview',session:'Learning session'}[state.page]);app.innerHTML=({entry,review,map,session}[state.page])();if(focus){window.scrollTo({top:0,behavior:'instant'});let h=app.querySelector('h1');h?.setAttribute('tabindex','-1');h?.focus({preventScroll:true});}}
function entry(){let d=data();return `<section class="intro"><div class="eyebrow">One goal. A path that fits.</div><h1>What would you like to learn?</h1><p>Tell us what you want to be able to do. We’ll shape the scope with you before you start.</p><div class="form"><label class="field"><span>Your learning goal</span><input id="goal" value="${esc(state.draftGoal||d.goal)}" aria-describedby="fixture-note"></label><div class="modes" aria-label="Learning scope"><button data-action="full" aria-pressed="${state.mode==='full'}">Full curriculum</button><button data-action="focused" aria-pressed="${state.mode==='focused'}">Focused lesson</button></div><p class="choice-note">${state.mode==='full'?'Recommended for a broad goal: a coherent path, taught one unit at a time.':'For one question or skill: a focused explanation, practice and feedback.'}</p><label class="field" style="margin-top:22px"><span>Where are you starting?</span><select id="starting"><option>${esc(d.context)}</option><option>I’m not sure — help me find my starting point</option><option>I already know some of this</option></select></label><div class="actions"><span class="meta">Placement check is optional</span>${button(state.mode==='full'?'Review the curriculum →':'Preview a focused lesson →','review','primary')}</div><p id="notice" role="status">${esc(state.notice)}</p></div><div class="samples"><span class="meta">Try a design fixture</span>${button('DSA in Go','go')}${button('Everyday Yoruba','yoruba')}</div><p class="sample-note" id="fixture-note">This prototype supports these two sample goals only. In the app, goals and curricula would be generated from your input.</p></section>`;}
function review(){let d=data();return `<div class="heading"><div><div class="eyebrow">Review your direction</div><h1>${esc(d.goal)}</h1><p>${esc(d.destination)}</p></div><span class="badge">Draft outline · sample</span></div><div class="review-grid"><section aria-label="Curriculum modules"><div class="review-list">${d.modules.map((m,i)=>`<article class="review-row"><span class="num">${String(i+1).padStart(2,'0')}</span><div><h3>${esc(m[0])}</h3><p>${esc(m[1])}</p></div><span class="meta">2 outcomes</span></article>`).join('')}</div></section><aside class="aside-note"><h3>The destination</h3><p>${esc(d.destination)}</p><h3>Starting assumption</h3><p>${esc(state.starting||d.context)}</p><h3>Outside this scope</h3><p>${esc(d.exclude)}</p><h3>Prepared as you go</h3><p>You review the whole outline now. Individual lessons are prepared when you need them.</p><span class="badge">6 modules · 12 outcomes</span></aside></div><div class="review-footer"><div>${button('← Adjust scope','entry','quiet')}<p>Production design: edit outcomes, validate sources and offer placement before approval.</p></div>${button('Approve sample & explore →','approve','primary')}</div>`;}
function prereq(i){return [[],[0],[1],[1],[2,3],[4]][i];}
function status(i){return i===0?'Demonstrated':i===1?'Practising':'Not checked';}
function map(){let d=data(),m=d.modules[state.selected],future=state.selected>1;return `<div class="heading"><div><div class="eyebrow">Your curriculum</div><h1>${esc(d.goal)}</h1><p>${esc(d.destination)}</p></div><span class="badge">Approved scope · sample v1</span></div><div class="summary" aria-label="Illustrative evidence"><span class="dem"><strong>2 / 12</strong> outcomes demonstrated</span><span><strong>1</strong> practising</span><span>Progress comes from evidence, not pages visited.</span></div><section class="next" aria-label="Recommended next step"><div class="text"><div class="eyebrow">Continue where you are</div><h2>${esc(d.modules[1][2][0])}</h2><p>${state.subject==='go'?'You can compare growth. Next, apply it to choosing how to find data.':'Build on familiar situations by working through a simple introduction.'}</p></div>${button('Continue learning →','session','primary')}</section><div class="workspace"><section aria-label="Curriculum navigation"><div class="viewbar"><div class="tabs" aria-label="Curriculum view"><button data-action="mapview" aria-pressed="${state.view==='map'}">Overview</button><button data-action="outlineview" aria-pressed="${state.view==='outline'}">Outline</button></div>${button(state.repair?'Hide sample adjustment':'Show sample adjustment','repair','quiet')}</div>${state.repair?`<aside class="repair"><h3>A short detour, with a way back</h3><p>${state.subject==='go'?'Let’s practise counting comparisons before returning to the lookup problem.':'Let’s revisit the purpose of the exchange before returning to the introduction.'}</p><p>Current unit → one repair → return to ${esc(d.modules[1][2][0])}</p>${button('Preview this repair','repairpreview')}</aside>`:''}${state.view==='map'?`<div class="graph" aria-label="Prerequisite map. Relationships are also named in each module’s details."><svg viewBox="0 0 600 440" preserveAspectRatio="none" aria-hidden="true"><g fill="none" stroke="#627469" stroke-width="1.3"><path d="M 240 73 H 360 M 450 125 V 215 M 450 125 V 150 H 150 V 215 M 450 260 V 295 H 150 V 345 M 150 260 V 345 M 240 367 H 360"/></g></svg>${d.modules.map((m,i)=>`<button class="node" data-module="${i}" aria-pressed="${i===state.selected}"><span class="status"><span class="${i===0?'done':i===1?'current':''}">${i===0?'✓':i===1?'●':'○'} ${status(i)}</span><span>${String(i+1).padStart(2,'0')}</span></span><h3>${esc(m[0])}</h3><div class="sub">${i===0?'2 outcomes demonstrated':i===1?'1 outcome practising':'2 outcomes · preview available'}</div></button>`).join('')}</div><p class="note">Lines show prerequisite relationships, also named in each module’s details. Layout is authored for this six-module design fixture.</p>`:`<ol class="outline">${d.modules.map((m,i)=>`<li><button data-module="${i}" aria-pressed="${i===state.selected}"><span>${i+1}. ${esc(m[0])}<small>${esc(m[1])}</small></span><span class="meta">${status(i)}</span></button></li>`).join('')}</ol>`}<div class="legend"><span>✓ Demonstrated</span><span><span class="dot">●</span> Practising</span><span>○ Not checked</span></div></section><aside class="inspector" aria-label="Selected module details"><div class="eyebrow">${future?'Previewing a future module':state.selected===0?'Reviewing earlier evidence':'Current module'}</div><h2>${esc(m[0])}</h2><p>${esc(m[1])}</p><h3>Outcomes</h3>${m[2].map((u,j)=>`<div class="unit">${esc(u)}<b>${state.selected===0?'Demonstrated in sample evidence':state.selected===1&&j===0?'Practising · not yet demonstrated':'Not checked'}</b></div>`).join('')}<h3>Before this</h3><p>${state.selected===0?'No curriculum prerequisites. Starting assumptions are reviewed at setup.':prereq(state.selected).map(i=>esc(d.modules[i][0])).join(' + ')+'. A readiness check can test relevant prior ability.'}</p>${future?`<p class="preview-warning">Previewing keeps your current learning task and evidence unchanged.</p>${button('About readiness checks','challenge','quiet')}`:button(state.selected===0?'Return to current sample lesson →':'Learn this unit →','session','primary')}<div id="notice" role="status">${esc(state.notice)}</div></aside></div>`;}
function session(){let d=data();return `<section class="lesson"><div class="trail">${button(state.mode==='focused'?'← Learning goal':'← Curriculum',state.mode==='focused'?'entry':'backmap','quiet')} / ${esc(d.modules[1][0])}</div><div class="lesson-panel"><div class="eyebrow">${state.mode==='focused'?'Focused lesson':'Current unit'} · sample teaching surface</div><h1>${state.subject==='go'?'How much work does finding one item take?':'What is this exchange trying to do?'}</h1><p>${state.subject==='go'?'Before choosing a structure, compare what you would actually do. A scan checks items in turn. An indexed lookup uses a key to find a candidate. The right choice depends on the task and its trade-offs.':'Start with a familiar situation before introducing new terms. Think about meeting someone for the first time: one person opens the exchange, and the other responds. This fixture demonstrates lesson structure, not Yoruba instruction.'}</p><div class="worked"><article><div class="eyebrow">${state.subject==='go'?'A concrete example':'First, the purpose'}</div><h3>${state.subject==='go'?'Find a name in a short list':'Meet someone new'}</h3><p>${state.subject==='go'?'A scan compares entries until it finds the name, or reaches the end.':'The goal is a friendly opening and a response appropriate to the situation.'}</p></article><article><div class="eyebrow">${state.subject==='go'?'Then, a question':'Then, a small check'}</div><h3>${state.subject==='go'?'What changes with a longer list?':'Recognize the next useful move'}</h3><p>${state.subject==='go'?'Think about comparisons in the worst case. Keep this reasoning visible when you choose a structure.':'Use a concrete situation and a short response task before asking for independent use.'}</p></article></div>${state.check?`<div class="session-evidence"><h3>Question-focus transition</h3><p>In production, the question would become the focused task. Your answer would stay visible during tutoring, and advancement would require evidence. This prototype does not grade an answer.</p></div>`:''}<footer><span class="meta">One learning task at a time.<br>No automatic advancement.</span>${button(state.check?(state.mode==='focused'?'Return to setup →':'Return to the curriculum →'):'Preview question focus →',state.check?(state.mode==='focused'?'entry':'backmap'):'check','primary')}</footer></div><p class="note">Illustrative session only. Full tutoring, actual questions, diagnostics and generated content are implementation work.</p></section>`;}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.id==='restart'){state={subject:'go',mode:'full',page:'entry',selected:1,view:'map',repair:false,check:false,notice:''};render();return;}if(b.dataset.module!==undefined){state.selected=+b.dataset.module;state.notice='';render(false);reveal('.inspector h2');return;}let a=b.dataset.action;if(!a)return;state.notice='';if(a==='go'||a==='yoruba'){state.subject=a;state.mode='full';state.draftGoal='';state.starting='';render();}else if(a==='full'||a==='focused'){state.draftGoal=document.getElementById('goal').value;state.starting=document.getElementById('starting').value;state.mode=a;render(false);document.getElementById('starting').value=state.starting;app.querySelector('[data-action='+a+']').focus({preventScroll:true});}else if(a==='entry'){state.page='entry';render();}else if(a==='review'){const goal=document.getElementById('goal').value.trim();if(goal.toLowerCase()!==data().goal.toLowerCase()){state.notice='Choose one of the two sample fixtures to explore this prototype. Custom goal generation belongs to the app.';document.getElementById('notice').textContent=state.notice;return;}state.starting=document.getElementById('starting').value;state.page=state.mode==='full'?'review':'session';state.check=false;render();}else if(a==='approve'||a==='backmap'){state.page='map';state.selected=1;render();}else if(a==='session'){state.page='session';state.check=false;render();}else if(a==='mapview'||a==='outlineview'){state.view=a==='mapview'?'map':'outline';render(false);app.querySelector('[data-action='+a+']').focus({preventScroll:true});}else if(a==='repair'){state.repair=!state.repair;render(false);if(state.repair)reveal('.repair h3');else app.querySelector('[data-action=repair]').focus({preventScroll:true});}else if(a==='repairpreview'){state.notice='Sample repair: revisit one concrete example, check it, then return to the current unit. No new syllabus or progress has been created.';render(false);reveal('#notice');}else if(a==='challenge'){state.notice='Production design: offer a short diagnostic for these prerequisites. A preview alone earns no credit. This prototype does not run assessments.';render(false);reveal('#notice');}else if(a==='check'){state.check=true;render(false);reveal('.session-evidence h3');}});render(false);
</script></body></html>
