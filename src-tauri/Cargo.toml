[package]
name = "learnforge"
version = "0.2.4"
description = "Adaptive lessons, worked explanations, visual learning, and optional code practice in a local-first desktop app."
authors = ["Oyetomi"]
license = "MIT"
repository = "https://github.com/Oyetomi/learnforge"
readme = "../README.md"
edition = "2021"

[lib]
name = "learnforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-http = { version = "2", features = ["json"] }
tokio = { version = "1", features = ["sync", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
