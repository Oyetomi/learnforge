[package]
name = "learnforge"
version = "0.2.2"
description = "A local-first Socratic learning harness with active recall, real code execution, LaTeX derivations, and FSRS-4.5 spaced repetition."
authors = ["Oyetomi"]
license = "MIT"
repository = "https://github.com/Oyetomi/learnforge"
readme = "../README.md"
edition = "2021"

[lib]
name = "learnforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
