<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ea580c" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#30363d" stroke-width="4"/>

  <!-- Anvil Base / Forge Geometry -->
  <path d="M 120 370 L 392 370 C 400 370 408 364 406 355 L 395 305 C 393 298 386 292 378 292 L 340 292 C 325 292 315 280 315 265 L 315 235 L 420 235 C 430 235 438 227 438 217 L 438 185 C 438 175 430 167 420 167 L 160 167 C 120 167 95 195 95 230 C 95 255 110 275 130 285 L 140 292 L 134 355 C 133 364 140 370 148 370 Z" 
        fill="#21262d" stroke="#58a6ff" stroke-width="6" stroke-linejoin="round" opacity="0.95"/>

  <!-- Glowing Flame Bursting from Center -->
  <path d="M 256 95 C 280 155 330 190 330 250 C 330 295 295 330 256 330 C 217 330 182 295 182 250 C 182 205 220 165 240 135 C 245 125 252 110 256 95 Z" 
        fill="url(#flame)" filter="url(#shadow)"/>

  <!-- Inner Core Spark -->
  <path d="M 256 185 C 270 215 290 238 290 265 C 290 288 274 305 256 305 C 238 305 222 288 222 265 C 222 240 242 220 250 205 Z" 
        fill="#fef08a" opacity="0.95"/>
</svg>
